[package]
name = "zkryptium-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
hex = "0.4"

[dependencies.zkryptium]
path = ".."
default-features = false
features = ["bbsplus", "bbsplus_blind", "bbsplus_nym"]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proof_verify"
path = "fuzz_targets/proof_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blind_sign"
path = "fuzz_targets/blind_sign.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde"
path = "fuzz_targets/serde.rs"
test = false
doc = false
bench = false
